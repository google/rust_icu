name: Auto Semantic Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish all crates to crates.io regardless of release-please output'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # If a release was created (PR was merged) or force_publish is requested, we proceed to publish
      - name: Checkout Code
        if: ${{ inputs.force_publish || steps.release.outputs.releases_created == 'true' || steps.release.outputs.release_created == 'true' || steps.release.outputs['rust_icu--release_created'] == 'true' }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install System Dependencies
        if: ${{ inputs.force_publish || steps.release.outputs.releases_created == 'true' || steps.release.outputs.release_created == 'true' || steps.release.outputs['rust_icu--release_created'] == 'true' }}
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config llvm llvm-dev clang

      - name: Setup Bazel
        if: ${{ inputs.force_publish || steps.release.outputs.releases_created == 'true' || steps.release.outputs.release_created == 'true' || steps.release.outputs['rust_icu--release_created'] == 'true' }}
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Bazel Publish
        if: ${{ inputs.force_publish || steps.release.outputs.releases_created == 'true' || steps.release.outputs.release_created == 'true' || steps.release.outputs['rust_icu--release_created'] == 'true' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bazel run //bazel:publish_all
