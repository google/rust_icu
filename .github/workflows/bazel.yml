name: Bazel Presubmit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - bazel-core-infrastructure
      - bazel-icu-compilation
      - bazel-migration
      - bazel-rust-icu-sys
      - bazel-other-crates
      - bazel-docs
      - bazel-auto-publish

# The presubmit reads the repository, builds it and runs the tests. It writes
# nothing back. Without this block the jobs inherit the default token scope,
# which zizmor reports as an overly broad permission.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bazel_version: ["8.7.0", "9.2.0"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Write Bazel version
        run: echo "${{ matrix.bazel_version }}" > .bazelversion

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Test all targets
        run: |
          set +e
          # We force tests to run serially to avoid global ICU timezone mutation races.
          bazel test --jobs=1 --test_env=RUST_TEST_THREADS=1 //...
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 4 ]; then
            echo "No tests found. Moving on."
            exit 0
          elif [ $EXIT_CODE -ne 0 ]; then
            exit $EXIT_CODE
          fi
